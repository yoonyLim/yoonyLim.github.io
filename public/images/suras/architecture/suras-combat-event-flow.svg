<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">SuraS 전투 이벤트 흐름</title>
  <desc id="desc">무기 발사부터 FDamageData, 데미지 컴포넌트, 적 피드백, UI 갱신까지 이어지는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #fff7ed; }
      .title { font: 700 34px Arial, "Noto Sans KR", sans-serif; fill: #111827; }
      .subtitle { font: 500 16px Arial, "Noto Sans KR", sans-serif; fill: #57534e; }
      .lane { fill: rgba(255,255,255,0.72); stroke: #fed7aa; stroke-width: 2; rx: 18; }
      .box { fill: #ffffff; stroke: #fb923c; stroke-width: 2; rx: 14; }
      .boxBlue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 14; }
      .boxRed { fill: #fee2e2; stroke: #ef4444; stroke-width: 2; rx: 14; }
      .boxGreen { fill: #f0fdf4; stroke: #22c55e; stroke-width: 2; rx: 14; }
      .h { font: 700 18px Arial, "Noto Sans KR", sans-serif; fill: #111827; }
      .t { font: 500 14px Arial, "Noto Sans KR", sans-serif; fill: #374151; }
      .laneText { font: 700 16px Arial, "Noto Sans KR", sans-serif; fill: #9a3412; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
      .label { font: 700 13px Arial, "Noto Sans KR", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="680" />
  <text x="48" y="58" class="title">전투 이벤트 흐름</text>
  <text x="48" y="86" class="subtitle">피격 판정은 FDamageData로 표준화되고, Damage Component의 Delegate가 UI와 AI 반응을 깨운다</text>

  <rect x="46" y="128" width="1028" height="118" class="lane" />
  <text x="70" y="158" class="laneText">플레이어 / 무기</text>
  <rect x="230" y="150" width="190" height="70" class="boxBlue" />
  <text x="252" y="178" class="h">Weapon State</text>
  <text x="252" y="202" class="t">Fire / Charge / Reload</text>
  <rect x="520" y="150" width="190" height="70" class="boxBlue" />
  <text x="542" y="178" class="h">Projectile / Trace</text>
  <text x="542" y="202" class="t">ImpactPoint, BoneName</text>

  <rect x="46" y="296" width="1028" height="118" class="lane" />
  <text x="70" y="326" class="laneText">전투 데이터</text>
  <rect x="360" y="318" width="210" height="70" class="box" />
  <text x="382" y="346" class="h">FDamageData</text>
  <text x="382" y="370" class="t">DamageAmount, Direction</text>
  <rect x="670" y="318" width="210" height="70" class="box" />
  <text x="692" y="346" class="h">TakeDamage()</text>
  <text x="692" y="370" class="t">IDamageable 인터페이스</text>

  <rect x="46" y="464" width="1028" height="142" class="lane" />
  <text x="70" y="494" class="laneText">피격 대상 / 피드백</text>
  <rect x="178" y="508" width="190" height="70" class="boxRed" />
  <text x="200" y="536" class="h">UACEnemyDamageSystem</text>
  <text x="200" y="560" class="t">부위 체력 / 절단</text>
  <rect x="466" y="508" width="190" height="70" class="boxRed" />
  <text x="488" y="536" class="h">OnDamaged / OnDeath</text>
  <text x="488" y="560" class="t">Hit, Dissolve, BT Stop</text>
  <rect x="754" y="508" width="190" height="70" class="boxGreen" />
  <text x="776" y="536" class="h">UI / Kill Log</text>
  <text x="776" y="560" class="t">체력바, 피격 화면</text>

  <path class="arrow" d="M420 185 L520 185" />
  <path class="arrow" d="M615 220 C595 268 525 292 465 318" />
  <path class="arrow" d="M570 353 L670 353" />
  <path class="arrow" d="M775 388 C720 448 605 493 561 508" />
  <path class="arrow" d="M466 543 L368 543" />
  <path class="arrow" d="M656 543 L754 543" />
  <path class="dashed" d="M273 508 C270 430 315 390 360 353" />
  <path class="dashed" d="M561 508 C645 446 778 430 849 508" />

  <text x="444" y="174" class="label">발사 입력</text>
  <text x="520" y="286" class="label">피격 결과 패키징</text>
  <text x="594" y="342" class="label">전달</text>
  <text x="734" y="448" class="label">체력 감소</text>
  <text x="390" y="528" class="label">부위 판정</text>
  <text x="676" y="528" class="label">Delegate</text>
  <text x="292" y="432" class="label">혈흔 / 파츠 생성</text>
  <text x="760" y="432" class="label">HUD 반영</text>
</svg>
